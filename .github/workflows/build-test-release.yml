name: Build, test and create release packages.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-default-groups --group test pytest

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Check code with ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check with mypy
        run: uv run mypy

  build:
    name: Build sdist and wheel
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build source distribution and wheel
        run: uv build

      - name: List built artifacts
        run: ls -las dist

      - name: Store built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve version and prerelease status
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG}"
          BASE_VERSION="$(echo "$VERSION" | sed -E 's/\.?(dev|rc)[0-9]+$//')"
          ANCHOR="version-$(echo "$BASE_VERSION" | tr '.' '-')"
          if [[ "$VERSION" == *dev* || "$VERSION" == *rc* ]]; then
              PRERELEASE="true"
          else
              PRERELEASE="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        run: |
          EXPECTED="${{ steps.meta.outputs.version }}"
          ACTUAL="$(uv run --no-default-groups python -c 'import wrapture; print(wrapture.__version__)')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Tag version ($EXPECTED) does not match __version__ ($ACTUAL) in src/wrapture/__init__.py" >&2
              exit 1
          fi
          echo "Version match: $ACTUAL"

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -las dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes body
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BASE_VERSION="${{ steps.meta.outputs.base_version }}"
          ANCHOR="${{ steps.meta.outputs.anchor }}"
          DOCS_URL="https://wrapture.readthedocs.io/en/latest/release-notes.html#${ANCHOR}"
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              cat > body.md <<EOF
          Preview release. Release notes for the upcoming ${BASE_VERSION}
          final (work in progress): ${DOCS_URL}

          May be installable from PyPi:

              pip install wrapture==${VERSION}

          If \`pip\` reports the version is unavailable, this preview has
          not been uploaded. The wheel and source distribution are
          attached, together with \`SHA256SUMS\` for verification.
          EOF
          else
              cat > body.md <<EOF
          Full release notes: ${DOCS_URL}

          Install from PyPi (recommended):

              pip install wrapture==${VERSION}

          PyPi uploads follow each GitHub release; if \`pip\` reports the
          version is unavailable, the matching PyPi upload may not have
          happened yet. The wheel and source distribution are attached,
          together with \`SHA256SUMS\` for verification.
          EOF
          fi
          cat body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              FLAGS+=("--prerelease")
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
              --title "wrapture ${{ steps.meta.outputs.version }}" \
              --notes-file body.md \
              "${FLAGS[@]}" \
              dist/*

  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
