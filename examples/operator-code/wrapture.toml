# Everything here is operator code reached by reference. The
# pythonpath entry is anchored to this file's directory, so the
# wrapture_local package next to it is importable however the
# process was launched.

pythonpath = "."

# Two [[sink]] entries fan out: a live printer and a JSONLines file
# whose relative path is anchored to this file's directory too.

[[sink]]
type = "printer"

[[sink]]
type = "jsonlines"
path = "trace.jsonl"

# A local instrumentation class, named by reference; the extra key is
# one of the settings the class declares, validated against that
# declaration when the file loads.

[[instrument]]
name = "wrapture_local.hooks:ShopInstrumentation"
threshold = 400
